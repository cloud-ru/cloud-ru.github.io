<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud.ru — Open Source</title>
  <meta name="description" content="Публичные open source проекты Cloud.ru на GitHub">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-secondary: #f7f8fa;
      --border: #e5e7eb;
      --green: #00b853;
      --green-hover: #00a049;
      --green-bg: #e6f9ef;
      --green-dark: #00875a;
      --text: #1a1a1a;
      --text-secondary: #5c6370;
      --text-muted: #8b919a;
      --star: #f59e0b;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,0.05), 0 1px 2px rgba(0,0,0,0.03);
      --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-secondary);
      color: var(--text);
      line-height: 1.6;
    }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, #002e14 0%, #003d1a 40%, #00291a 100%);
      color: #fff;
      padding: 4rem 1.5rem 3.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -10%;
      width: 120%;
      height: 200%;
      background: radial-gradient(ellipse at 30% 50%, rgba(0,184,83,0.15) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 30%, rgba(0,184,83,0.1) 0%, transparent 50%);
      pointer-events: none;
    }

    .hero-inner {
      max-width: 720px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }

    .hero h1 span {
      color: var(--green);
    }

    .hero p {
      font-size: 1.1rem;
      color: rgba(255,255,255,0.75);
      max-width: 560px;
      margin: 0 auto;
      line-height: 1.7;
    }

    /* ── Stats ── */
    .stats {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 1.5rem 1rem;
    }

    .stats-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      gap: 3rem;
      flex-wrap: wrap;
    }

    .stat {
      text-align: center;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
    }

    .stat-value .accent {
      color: var(--green);
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 0.15rem;
    }

    /* ── Toolbar ── */
    .toolbar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .toolbar-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.55rem 0.75rem 0.55rem 2.25rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      font-family: inherit;
      background: var(--bg-secondary);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .search-box input:focus {
      border-color: var(--green);
    }

    .search-box input::placeholder {
      color: var(--text-muted);
    }

    .search-box svg {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    .filter-tabs {
      display: flex;
      gap: 0.25rem;
      background: var(--bg-secondary);
      border-radius: 8px;
      padding: 0.2rem;
    }

    .filter-tab {
      padding: 0.4rem 0.85rem;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .filter-tab.active {
      background: var(--bg);
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.06);
    }

    .filter-tab:hover:not(.active) {
      color: var(--text);
    }

    .sort-select {
      padding: 0.55rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.8rem;
      font-family: inherit;
      background: var(--bg-secondary);
      color: var(--text);
      cursor: pointer;
      outline: none;
    }

    .results-count {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    /* ── Cards grid ── */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1.5rem 3rem;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      transition: box-shadow 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      border-color: var(--green);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 600;
      color: var(--green-dark);
      word-break: break-word;
    }

    .card-org {
      flex-shrink: 0;
      font-size: 0.7rem;
      font-weight: 500;
      padding: 0.15rem 0.45rem;
      border-radius: 5px;
      background: var(--bg-secondary);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .card-desc {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.55;
      flex: 1;
      margin-bottom: 0.75rem;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .meta-item svg {
      width: 14px;
      height: 14px;
    }

    .lang-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .meta-stars {
      color: var(--star);
      font-weight: 600;
    }

    .meta-license {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-size: 0.7rem;
    }

    .card-topics {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-bottom: 0.75rem;
    }

    .topic {
      font-size: 0.7rem;
      background: var(--green-bg);
      color: var(--green-dark);
      padding: 0.1rem 0.4rem;
      border-radius: 4px;
      font-weight: 500;
    }

    /* ── Empty state ── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    /* ── Footer ── */
    .footer {
      text-align: center;
      padding: 1.5rem 1rem;
      color: var(--text-muted);
      font-size: 0.8rem;
      border-top: 1px solid var(--border);
      background: var(--bg);
    }

    .footer a {
      color: var(--green-dark);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .updated {
      color: var(--text-muted);
      font-size: 0.75rem;
    }

    /* ── Loading ── */
    .loading {
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem 1rem;
      color: var(--text-muted);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .hero { padding: 2.5rem 1rem 2rem; }
      .hero h1 { font-size: 1.75rem; }
      .hero p { font-size: 0.95rem; }
      .stats-inner { gap: 1.5rem; }
      .stat-value { font-size: 1.35rem; }
      .toolbar-inner { gap: 0.5rem; }
      .cards { grid-template-columns: 1fr; }
      .container { padding: 1rem 1rem 2rem; }
    }
  </style>
</head>
<body>

<section class="hero">
  <div class="hero-inner">
    <h1><span>Cloud.ru</span> Open Source</h1>
    <p>Мы создаём инструменты для работы с облачной платформой и делимся технологическими решениями с open source сообществом</p>
  </div>
</section>

<section class="stats">
  <div class="stats-inner">
    <div class="stat">
      <div class="stat-value" id="stat-repos">—</div>
      <div class="stat-label">Репозиториев</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-stars">—</div>
      <div class="stat-label">Звёзд</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-forks">—</div>
      <div class="stat-label">Форков</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="stat-langs">—</div>
      <div class="stat-label">Языков</div>
    </div>
  </div>
</section>

<section class="toolbar">
  <div class="toolbar-inner">
    <div class="search-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search" placeholder="Поиск по названию или описанию...">
    </div>
    <div class="filter-tabs" id="org-filter">
      <button class="filter-tab active" data-org="all">Все</button>
      <button class="filter-tab" data-org="cloud-ru">cloud-ru</button>
      <button class="filter-tab" data-org="cloud-ru-tech">cloud-ru-tech</button>
    </div>
    <select class="sort-select" id="sort">
      <option value="stars">По звёздам</option>
      <option value="updated">По обновлению</option>
      <option value="name">По названию</option>
    </select>
    <span class="results-count" id="results-count"></span>
  </div>
</section>

<main class="container">
  <div class="cards" id="cards">
    <div class="loading"><div class="spinner"></div>Загрузка репозиториев...</div>
  </div>
</main>

<footer class="footer">
  <div class="footer-links">
    <a href="https://github.com/cloud-ru" target="_blank" rel="noopener">cloud-ru</a>
    <a href="https://github.com/cloud-ru-tech" target="_blank" rel="noopener">cloud-ru-tech</a>
    <a href="https://cloud.ru" target="_blank" rel="noopener">cloud.ru</a>
  </div>
  <div class="updated" id="updated"></div>
</footer>

<script>
  const LANG_COLORS = {
    JavaScript: '#f1e05a', TypeScript: '#3178c6', Python: '#3572a5',
    Go: '#00add8', Java: '#b07219', 'C#': '#178600', C: '#555555',
    'C++': '#f34b7d', Rust: '#dea584', Ruby: '#701516', PHP: '#4f5d95',
    Shell: '#89e051', Kotlin: '#a97bff', Swift: '#f05138', Dart: '#00b4ab',
    HCL: '#844fba', Jupyter: '#da5b0b', HTML: '#e34c26', CSS: '#563d7c',
    Dockerfile: '#384d54', Makefile: '#427819', SCSS: '#c6538c',
    'Jupyter Notebook': '#da5b0b', Vue: '#41b883', Svelte: '#ff3e00'
  };

  let allRepos = [];
  let currentOrg = 'all';
  let currentSort = 'stars';
  let currentSearch = '';

  function escapeHtml(str) {
    if (!str) return '';
    const el = document.createElement('span');
    el.textContent = str;
    return el.innerHTML;
  }

  function formatDate(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleDateString('ru-RU', {
      year: 'numeric', month: 'short', day: 'numeric'
    });
  }

  function relativeDate(iso) {
    if (!iso) return '';
    const diff = Date.now() - new Date(iso).getTime();
    const days = Math.floor(diff / 86400000);
    if (days === 0) return 'сегодня';
    if (days === 1) return 'вчера';
    if (days < 30) return days + ' дн. назад';
    const months = Math.floor(days / 30);
    if (months < 12) return months + ' мес. назад';
    return Math.floor(months / 12) + ' г. назад';
  }

  function renderStats() {
    const repos = allRepos;
    const totalStars = repos.reduce((s, r) => s + r.stars, 0);
    const totalForks = repos.reduce((s, r) => s + (r.forks || 0), 0);
    const langs = new Set(repos.map(r => r.language).filter(Boolean));

    document.getElementById('stat-repos').textContent = repos.length;
    document.getElementById('stat-stars').innerHTML = totalStars + ' <span class="accent">&#9733;</span>';
    document.getElementById('stat-forks').textContent = totalForks;
    document.getElementById('stat-langs').textContent = langs.size;
  }

  function renderCards() {
    let filtered = allRepos;

    if (currentOrg !== 'all') {
      filtered = filtered.filter(r => r.org === currentOrg);
    }

    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      filtered = filtered.filter(r =>
        r.name.toLowerCase().includes(q) ||
        (r.description && r.description.toLowerCase().includes(q))
      );
    }

    filtered.sort((a, b) => {
      if (currentSort === 'stars') return b.stars - a.stars;
      if (currentSort === 'updated') return new Date(b.updated_at) - new Date(a.updated_at);
      return a.name.localeCompare(b.name);
    });

    document.getElementById('results-count').textContent = filtered.length + ' из ' + allRepos.length;

    const container = document.getElementById('cards');

    if (filtered.length === 0) {
      container.innerHTML = '<div class="empty"><div class="empty-icon">&#128269;</div>Ничего не найдено</div>';
      return;
    }

    container.innerHTML = filtered.map(r => {
      const langColor = LANG_COLORS[r.language] || '#999';
      const topics = (r.topics || []).slice(0, 4);

      return `<a class="card" href="${escapeHtml(r.url)}" target="_blank" rel="noopener">
        <div class="card-header">
          <div class="card-name">${escapeHtml(r.name)}</div>
          <span class="card-org">${escapeHtml(r.org)}</span>
        </div>
        <div class="card-desc">${escapeHtml(r.description) || '<span style="color:var(--text-muted);font-style:italic">Нет описания</span>'}</div>
        ${topics.length ? `<div class="card-topics">${topics.map(t => `<span class="topic">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
        <div class="card-meta">
          ${r.language ? `<span class="meta-item"><span class="lang-dot" style="background:${langColor}"></span>${escapeHtml(r.language)}</span>` : ''}
          <span class="meta-item meta-stars">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
            ${r.stars}
          </span>
          ${r.forks ? `<span class="meta-item">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M18 9v1a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9"/><line x1="12" y1="12" x2="12" y2="15"/></svg>
            ${r.forks}
          </span>` : ''}
          ${r.license && r.license !== 'NOASSERTION' ? `<span class="meta-item"><span class="meta-license">${escapeHtml(r.license)}</span></span>` : ''}
          <span class="meta-item" title="${formatDate(r.updated_at)}">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            ${relativeDate(r.updated_at)}
          </span>
        </div>
      </a>`;
    }).join('');
  }

  function initControls() {
    document.getElementById('search').addEventListener('input', e => {
      currentSearch = e.target.value.trim();
      renderCards();
    });

    document.querySelectorAll('.filter-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelector('.filter-tab.active').classList.remove('active');
        btn.classList.add('active');
        currentOrg = btn.dataset.org;
        renderCards();
      });
    });

    document.getElementById('sort').addEventListener('change', e => {
      currentSort = e.target.value;
      renderCards();
    });
  }

  async function fetchAllPages(org) {
    const repos = [];
    let page = 1;
    while (true) {
      const res = await fetch(
        `https://api.github.com/orgs/${org}/repos?type=public&per_page=100&page=${page}`,
        { headers: { 'Accept': 'application/vnd.github+json' } }
      );
      if (!res.ok) throw new Error(`GitHub API ${res.status}`);
      const data = await res.json();
      if (data.length === 0) break;
      repos.push(...data);
      page++;
    }
    return repos.map(r => ({
      name: r.name,
      url: r.html_url,
      description: r.description,
      language: r.language,
      license: r.license ? r.license.spdx_id : null,
      stars: r.stargazers_count,
      forks: r.forks_count,
      updated_at: r.pushed_at,
      topics: r.topics || [],
      org
    }));
  }

  async function load() {
    try {
      const res = await fetch('data/repos.json');
      if (res.ok) {
        const data = await res.json();
        allRepos = [
          ...(data['cloud-ru'] || []).map(r => ({ ...r, org: 'cloud-ru' })),
          ...(data['cloud-ru-tech'] || []).map(r => ({ ...r, org: 'cloud-ru-tech' }))
        ];
        if (data.updated_at) {
          document.getElementById('updated').textContent =
            'Данные обновлены ' + formatDate(data.updated_at);
        }
        renderStats();
        renderCards();
        initControls();
        return;
      }
    } catch (_) {}

    try {
      const [cr, crt] = await Promise.all([
        fetchAllPages('cloud-ru'),
        fetchAllPages('cloud-ru-tech')
      ]);
      allRepos = [...cr, ...crt];
      renderStats();
      renderCards();
      initControls();
      document.getElementById('updated').textContent =
        'Данные обновлены ' + formatDate(new Date().toISOString());
    } catch (err) {
      document.getElementById('cards').innerHTML =
        `<div class="empty"><div class="empty-icon">&#9888;&#65039;</div>Ошибка загрузки: ${escapeHtml(err.message)}</div>`;
    }
  }

  load();
</script>

</body>
</html>
