name: Update repository data

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch repos from cloud-ru
        run: |
          page=1
          echo '[]' > /tmp/cloud-ru.json
          while true; do
            response=$(curl -sf -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/cloud-ru/repos?type=public&per_page=100&page=${page}")
            count=$(echo "$response" | jq 'length')
            if [ "$count" -eq 0 ]; then break; fi
            jq -s '.[0] + .[1]' /tmp/cloud-ru.json <(echo "$response") > /tmp/cloud-ru-merged.json
            mv /tmp/cloud-ru-merged.json /tmp/cloud-ru.json
            page=$((page + 1))
          done

      - name: Fetch repos from cloud-ru-tech
        run: |
          page=1
          echo '[]' > /tmp/cloud-ru-tech.json
          while true; do
            response=$(curl -sf -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/cloud-ru-tech/repos?type=public&per_page=100&page=${page}")
            count=$(echo "$response" | jq 'length')
            if [ "$count" -eq 0 ]; then break; fi
            jq -s '.[0] + .[1]' /tmp/cloud-ru-tech.json <(echo "$response") > /tmp/cloud-ru-tech-merged.json
            mv /tmp/cloud-ru-tech-merged.json /tmp/cloud-ru-tech.json
            page=$((page + 1))
          done

      - name: Build repos.json
        run: |
          jq -n \
            --arg updated "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --slurpfile cr /tmp/cloud-ru.json \
            --slurpfile crt /tmp/cloud-ru-tech.json \
            '{
              updated_at: $updated,
              "cloud-ru": [ $cr[0][] | {
                name: .name,
                url: .html_url,
                description: .description,
                license: (if .license then .license.spdx_id else null end),
                stars: .stargazers_count,
                updated_at: .pushed_at
              }] | sort_by(-.stars),
              "cloud-ru-tech": [ $crt[0][] | {
                name: .name,
                url: .html_url,
                description: .description,
                license: (if .license then .license.spdx_id else null end),
                stars: .stargazers_count,
                updated_at: .pushed_at
              }] | sort_by(-.stars)
            }' > data/repos.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore: update repository data"
          git push
